.scroll-x{overflow-x:auto}
/* categories */
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:0}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 14px;font-weight:500;font-size:14px;color:var(--ink);letter-spacing:-.01em}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04)}
.cat-row{display:flex;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:.5px solid var(--line);background:none;width:100%;text-align:left}
.cat-row:last-child{border-bottom:0}
.cat-row .mid{flex:1;min-width:0;display:grid;gap:4px}
.cat-row .t1{font-weight:600}
.cat-row .t2{font-size:12.5px;color:var(--muted)}
.budget{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.budget b{display:block;height:100%;border-radius:6px}
/* fab, sheet, toast */
/* desktop add button folds to a circle while scrolling down and, where there is room, steps out of the column */
.fab{right:max(16px,calc(50% - 474px));bottom:calc(20px + var(--sab));z-index:30;border:0;background:var(--accent-fill);color:var(--accent-ink);height:56px;padding:0 22px 0 18px;border-radius:28px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent-fill) 40%,transparent);position:absolute;transition:padding .2s var(--ease-out),gap .2s var(--ease-out),translate .2s var(--ease-out)}
.fab span{font-size:24px;line-height:1;font-weight:500}
.scrim{position:fixed;inset:var(--vis-t) 0 var(--vis-b);background:rgba(5,8,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
/* sheets: denser */
.sheet{background:var(--sheet);width:100%;max-width:560px;overflow-y:auto;border-radius:13px 13px 0 0;padding:6px 16px calc(20px + var(--sab));display:grid;overscroll-behavior:contain;gap:12px;overflow-x:hidden}
@media (min-width:760px){
  .scrim{align-items:center}
  .sheet{border-radius:16px}
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet{animation:none}
}
.grab{width:36px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--label-3) 50%,transparent);margin:0 auto}
.sheet h2{margin:0;font-family:var(--f-body);font-weight:600;letter-spacing:-.02em}
.field{display:grid;gap:6px}
/* add sheet / forms */
.field label,.field .lbl{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.01em;padding-left:4px}
.input{width:100%;border:.5px solid var(--line);background:var(--card-el);border-radius:10px;padding:11px 12px}
.amount-in{font-family:var(--f-display);font-weight:700;letter-spacing:-.04em;border:0;background:transparent;padding:0;width:auto;outline:none;font-size:56px;line-height:1.05;text-align:center;field-sizing:content;min-width:2ch;max-width:100%;font-variant-numeric:tabular-nums;caret-color:var(--accent)}
.amount-box{display:flex;align-items:baseline;justify-content:center;gap:4px;border-bottom:2px solid transparent;padding:6px 0 4px;transition:border-color .15s ease-out}
.amount-box:focus-within{border-color:transparent}
.amount-box span{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.btn.primary{background:var(--accent-fill);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.err{color:var(--exp);font-size:13px;font-weight:600;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px}
.status .dot{width:9px;height:9px}
textarea.dump{width:100%;min-height:140px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--sab) + var(--vis-b));z-index:90;border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);background:#1B2130;color:#F4F6FB;border:1px solid rgba(255,255,255,.12);white-space:nowrap;max-width:calc(100% - 24px);animation:m-toast-in .26s var(--ease-out)}
#toast button{border:0;background:transparent;font-weight:800;color:#8DB8FF;filter:none}
/* empty states */
.empty{text-align:center;display:grid;justify-items:center;padding:36px 20px;gap:8px}
.empty h2{margin:0;font-family:var(--f-display);letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.muted{color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;min-height:32px}
.mini{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.mini span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.mini b{font-family:var(--f-display);font-size:18px;font-weight:700;white-space:nowrap}
/* notes, table views, sparklines, heatmap, compare, selection, filters */
.how{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:10px 0 0;line-height:1.5}
.how i{flex:none;width:17px;height:17px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px;font-family:var(--f-display)}
.how b{color:var(--ink);font-weight:600}
details.tview{margin-top:8px}
details.tview summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.tview summary::-webkit-details-marker{display:none}
details.tview summary::before{content:"";width:12px;height:9px;border:1.6px solid currentColor;border-radius:2px;box-shadow:inset 0 3px 0 -1.4px currentColor}
details.tview[open] summary{margin-bottom:6px}
details.tview table.cmp{font-size:12.5px}
.spark{width:100%;height:30px;display:block;margin-top:2px}
.ring{flex:none;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--hero-muted);text-align:center}
.ring svg{display:block}
.hero .spark{height:46px;position:relative;z-index:1}
.ins-bar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--muted) 18%,transparent);margin-top:8px;position:relative;overflow:visible}
.ins-bar b{display:block;height:100%;border-radius:6px}
.ins-bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.tag{font-size:11px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.tx.sel{background:var(--accent-soft)}
.tx .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:transparent}
.tx.sel .ck{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
/* the check sits on the icon's corner, so entering selection never shifts the rows */
.avw{position:relative;flex:none;display:grid}
.avw .ck{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;font-size:12px;background:var(--surface);box-shadow:0 0 0 2px var(--surface)}
.tx.sel .avw .ck{background:var(--accent-fill)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab) + var(--vis-b));z-index:45;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;display:flex;gap:6px;align-items:center;max-width:calc(100% - 24px);box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700;font-size:14px;overflow-x:auto}
.selbar button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;background:color-mix(in srgb,var(--bg) 16%,transparent);color:inherit;white-space:nowrap}
.selbar span{white-space:nowrap;margin-right:4px}
@media (max-width:640px){
  .selbar{bottom:calc(84px + var(--sab) + var(--vis-b))}
}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:0;border-radius:14px;padding:12px}
.filters .chips{grid-column:1/-1;margin:0;padding:0;flex-wrap:wrap}
.pair-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:2px 0 10px;flex-wrap:wrap}
.pair-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pairs{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.pair .nm{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair .dv{font-family:var(--f-num);font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.pair .bars{grid-column:1/-1;display:grid;gap:3px}
.pair .bars b{display:block;height:7px;border-radius:5px;min-width:2px}
.range4{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center;margin-bottom:10px}
.range4 .tagA,.range4 .tagB{font-weight:800;font-size:12px;border-radius:7px;width:24px;height:24px;display:grid;place-items:center}
.range4 .tagA{background:var(--accent-fill);color:var(--accent-ink)}
.range4 .tagB{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.range4 .input{padding:8px 10px;min-width:0}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat3 .mini b{font-size:16px}
.switch{display:flex;gap:10px;border-radius:12px;background:var(--surface-2);cursor:pointer;padding:8px 12px;align-items:center;border:1px solid transparent}
.switch input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.switch small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.cat-row .share{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cat-row .share b{display:block;height:100%;border-radius:4px}
.stat3 .mini b~span{font-weight:500;font-size:11.5px;margin-top:2px}
.brand i{flex:none}
.bname{overflow:hidden;text-overflow:ellipsis}
/* mobile shell. The page itself never scrolls: only #scroller does, so the bottom bar and the add button
   stay on screen even where the host stretches the frame to the content height (iOS). */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;height:var(--vis-h,100dvh);top:var(--vis-t);display:flex;flex-direction:column;position:relative;overflow:hidden}
/* scrollIntoView leaves room for the day header above and the toast below */
#scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-padding:48px 0 80px}
button,a,input,select,label{touch-action:manipulation}
@media (hover:none){
  .tx:hover{background:none}
  .tx.sel:hover{background:var(--accent-soft)}
}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:44px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.row2>*,.range-in>*,.range4>*{min-width:0}
.sheet{max-height:92vh;max-height:92dvh;max-height:calc(var(--vis-h,100dvh)*.92)}
/* keep Guardar reachable without scrolling past long category lists */
.sheet>.actions:last-child{position:sticky;bottom:calc(-20px - var(--sab));background:var(--sheet);margin:0 -16px calc(-20px - var(--sab));padding:12px 16px calc(16px + var(--sab));border-top:.5px solid var(--line);z-index:2}
@media (max-width:640px),(pointer:coarse) and (max-width:932px){
  header.top .tabs{display:none}
  .fab{display:none!important}
  main{padding-bottom:28px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:relative;flex:none;z-index:40;background:var(--bar-blur);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-top:.5px solid var(--line);padding:4px 4px calc(4px + var(--sab));isolation:isolate;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;letter-spacing:.01em;color:var(--muted);padding:4px 0;min-height:48px;justify-content:center;position:relative;-webkit-user-select:none;user-select:none}
  .bnav button svg{width:26px;height:26px;transition:transform .15s ease-out}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav .bplus span{width:50px;height:38px;border-radius:19px;background:var(--accent-fill);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent-fill) 70%,transparent);margin-top:0;transition:transform .15s ease-out,box-shadow .15s ease-out}
  .bnav .bplus svg{width:22px;height:22px}
  #toast{bottom:calc(84px + var(--sab) + var(--vis-b))}
  .selbar{bottom:calc(84px + var(--sab) + var(--vis-b));left:12px;right:12px;transform:none;max-width:none;justify-content:space-between;flex-wrap:wrap;overflow:visible;padding:10px}
  /* 16px stops iOS from zooming into fields when they get focus */
  .input,.search,select,textarea{font-size:16px}
  .card{padding:14px 16px}
  .stat3{grid-template-columns:1fr;gap:6px}
  .stat3 .mini{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
  .stat3 .mini>span:first-child{flex:1 1 auto}
  .stat3 .mini b~span{flex-basis:100%;margin:0}
  .range4{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px 6px}
  .range4 .input{padding:8px 6px;font-size:14px}
  .filters{grid-template-columns:1fr 1fr}
  .sheet{padding-inline:16px}
  .actions .btn{flex:1 1 120px;min-height:48px}
  .selbar span{margin:0 0 2px 4px;flex:1 1 calc(100% - 60px);order:-2}
  .selbar button{padding:9px 10px;flex:1 1 auto}
  .bn-app{display:none}
  .bar .brand{display:none}
}
@media (max-width:360px){
  .brand{font-size:17px;gap:6px}
  .brand i{width:26px;height:26px;font-size:15px}
  #periodBtn{padding:0 9px 0 10px;max-width:60vw;font-size:15px}
  .kpi .val{font-size:18px}
  .hero .big{font-size:32px}
  .ring svg{width:64px;height:64px}
  .range4 .input{font-size:13px;padding:8px 4px}
}
/* add sheet: compact category grid */
.ctiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 4px;background:var(--card-el);border-radius:14px;padding:10px 6px 6px}
.ctile{border:0;display:grid;justify-items:center;min-width:0;background:none;padding:5px 0 4px;gap:5px;border-radius:12px}
.ctile .ci{border-radius:11px;display:grid;place-items:center;line-height:1;background:color-mix(in srgb,var(--cc) var(--tint-a),transparent);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--cc) 30%,transparent);width:42px;height:42px;font-size:22px;transition:transform .12s ease-out,background-color .18s ease-out,box-shadow .18s ease-out}
.ctile .cn{font-size:12px;font-weight:500;line-height:1.2;text-align:center;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;-webkit-hyphens:auto;hyphens:auto;min-height:2.4em;max-width:100%;letter-spacing:-.01em}
.ctile .cn.long{font-size:10px;letter-spacing:-.03em}
.ctile[aria-pressed="true"]{border-color:transparent}
.ctile[aria-pressed="true"] .ci{box-shadow:0 0 0 2px var(--card-el),0 0 0 4px var(--accent)}
.ctile.new{border:0;background:none}
.ctile.new .ci{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--accent);font-weight:600;font-family:var(--f-display)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icn{height:40px;border:1.5px solid transparent;border-radius:12px;background:var(--surface-2);font-size:20px;line-height:1;padding:0}
.icn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* alerts, fixed monitor, suggestion chips */
.alerts{display:grid;gap:0;background:var(--surface);border-radius:14px;overflow:hidden}
/* alert cards: tinted edge by kind so they scan without reading */
.alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;border-radius:0;color:var(--ink);font-size:15px;line-height:1.33;padding:11px 14px;min-height:52px;position:relative}
.alert+.alert::before{content:"";position:absolute;top:0;right:0;left:56px;border-top:.5px solid var(--line)}
.alert .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);color:#fff;font-size:15px}
.alert.warn .ic{background:var(--al-warn)}
.alert.bad .ic{background:var(--al-bad)}
.alert.good .ic{background:var(--al-good)}
.alert.info .ic{background:var(--al-info)}
.al-t{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.al-t b{font-weight:600}
.al-t span{color:var(--muted)}
.al-more{justify-self:start;font-size:14px;padding:8px 14px 10px;margin-left:42px}
.fc-net{font-size:14px}
.fx-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fx-b .chip{min-height:32px;padding:4px 10px;font-size:12.5px}
.sugg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.sugg[hidden]{display:none}
.sugg .chip{min-height:36px;padding:4px 10px;font-size:13px}
.tx.fx .t1{display:block;text-align:left;white-space:normal}
.xhint{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}
.xhint[hidden]{display:none}
.xhint .chip{min-height:34px;font-size:13px}
.split-in{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.split-in .input{width:64px;text-align:center}
.brk-row.pot{width:100%;border:0;background:none;color:inherit;text-align:left;padding:0;font:inherit}
.pot-s{flex-wrap:wrap;margin-top:8px}
/* cash-flow overview + day groups */
.flow{display:grid;gap:22px;align-items:start}
.fl-col{display:grid;gap:12px;min-width:0}
.fl-b{gap:22px}
.fl-b>*,.fl-c>*{min-width:0}
.fl-c{gap:0}
@media (min-width:900px){
  .flow{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:22px 20px}
  .fl-a{grid-column:1;grid-row:1}
  .fl-b{grid-column:2;grid-row:1/span 2}
  .fl-c{grid-column:1;grid-row:2}
}
.flow-h{display:grid;gap:2px}
.neto-k{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.flow .big{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,11.5vw,44px);letter-spacing:-.04em;line-height:1.08;white-space:nowrap}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:13px;line-height:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px}
.sh .link{text-transform:none;letter-spacing:0;font-size:15px;font-weight:400;padding:0;min-height:0}
.fl-ps{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:15px;color:var(--muted)}
.fl-p{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fl-p .num{font-weight:600;color:var(--ink);letter-spacing:-.01em;font-family:var(--f-num)}
.fl-p i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.fl-p.inc .num{color:var(--inc)}

/* ---------- keep the whole app on screen ----------

   page can stay scrolled a little (after the keyboard, a rotation or the Safari bars moving), so the top or the
   bottom of the frame falls outside the screen and the bottom bar is cut. So: snap any page scroll back to 0, and
   measure which slice of the frame is really visible (an IntersectionObserver sees the clipping by the host and the
   screen even inside a cross-origin frame). When part is cut off, the app moves into that slice: --vis-t (offset
   from the top), --vis-h (height) and --vis-b (cut at the bottom, for the toast, the selection bar and the sheets).
   The probe is a fixed full-height box that never moves with the app, so every reading starts from scratch, and we
   read again on any touch, on resize/rotation/return and every 2 s while visible, because WebKit does not always
   report a change in the host. On desktop only a cut bottom with the top in view counts (an inline preview the

  document.addEventListener("focusout", () => setTimeout(() => { unshift(); recheck(); }, 120));
