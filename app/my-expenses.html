:root[data-theme="dark"]{--bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--ink:#FFFFFF;--muted:#A1A1A8;--line:rgba(84,84,88,.62);--accent:#9C95FF;--accent-ink:#FFFFFF;--accent-soft:rgba(156,149,255,.16);--hero:#1C1C1E;--hero-ink:#FFFFFF;--hero-muted:#A1A1A8;--inc:#3DD16B;--inc-soft:rgba(61,209,107,.14);--exp:#FF6B61;--exp-soft:rgba(255,107,97,.14);--warn:#FFB340;--warn-soft:rgba(255,179,64,.14);--shadow:none;--raise:#636366;--hover:rgba(255,255,255,.06);--accent-fill:#5A50EC;--accent-2:#4A4396;--bar:#3A3A3E;--bar-in:#23533A;--bar-blur:rgba(22,22,24,.8);--sheet:#1C1C1E;--card-el:#2C2C2E;--label-3:#7C7C82;--tint-a:30%;--al-warn:#FF9F0A;--al-bad:#FF453A;--al-good:#30D158;--al-info:#5E5CE6;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}

button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.amt,.kpi .val,.mini b,.brk-row .am,table.cmp td,.tx-day .num,.fl-p,.pair .dv{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
/* header */
/* header: the line shows only once content scrolls under it */
header.top{z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:.5px solid var(--line);position:relative;top:auto;flex:none;padding-top:env(safe-area-inset-top,0px);border-bottom-color:transparent;transition:border-color .18s ease-out,box-shadow .18s ease-out}
.bar{display:flex;align-items:center;padding-block:10px 6px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;flex:1;min-width:0;display:flex;align-items:center;white-space:nowrap}
#periodBtn{min-width:0;flex:none;height:36px;padding:0 11px 0 12px;border:0;border-radius:18px;background:var(--surface);box-shadow:0 0 0 .5px var(--line),0 1px 2px rgba(0,0,0,.04);font-size:16px;font-weight:600;letter-spacing:-.015em;gap:7px;color:var(--ink)}
#periodBtn .pcal{color:var(--accent);flex:none}
#periodBtn .pchev{color:var(--muted);flex:none}
#themeBtn{margin-left:auto}
.bar .brand{flex:1 1 auto}
#periodLbl{text-overflow:ellipsis;overflow:visible}
@media (max-width:420px){
  .brand{font-size:18px}
  .brand i{width:28px;height:28px}
}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent-fill);color:var(--accent-ink);font-style:normal;font-size:17px;font-weight:700}
.pill-btn{border:.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;color:var(--ink)}
.icon-btn{border:0;background:var(--surface-2);color:var(--accent);border-radius:999px;display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:500;font-size:15px;color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.icon-btn svg{width:18px;height:18px}
.range-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yr td:first-child{font-weight:700}
main{padding-block:16px 120px}
.bnav{display:none}
@media (max-width:640px){
  header.top .tabs{display:none}
  .fab{display:none!important}

  #toast{bottom:calc(84px + var(--sab) + var(--vis-b))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar-blur);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-top:.5px solid var(--line);padding:6px 4px calc(6px + var(--sab))}

  .bnav button svg{width:26px;height:26px}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav .bplus span{width:50px;height:38px;border-radius:19px;background:var(--accent-fill);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent-fill) 70%,transparent)}
  .bnav .bplus svg{width:22px;height:22px}
}
section.view{display:grid;gap:16px}
.grid2{display:grid;gap:14px}
@media (min-width:760px){
  .grid2{grid-template-columns:1fr 1fr}
  .span2{grid-column:1/-1}
}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.02em;text-wrap:balance}
.card .sub{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.4}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-size:13px;letter-spacing:.01em;text-transform:none;font-weight:600;color:var(--muted)}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.05)}
.hero .eyebrow{color:var(--hero-muted)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,48px);letter-spacing:-.03em;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.kpi{background:var(--surface);border:0;border-radius:16px;padding:12px 12px 8px;display:grid;gap:3px;min-width:0;box-shadow:var(--shadow)}
.kpi .lbl{font-size:13px;color:var(--muted);font-weight:500}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.delta{font-size:13px;font-weight:600;border-radius:13px;padding:3px 9px;justify-self:start;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.good{background:var(--inc-soft);color:var(--inc)}
.delta.bad{background:var(--exp-soft);color:var(--exp)}
.delta.flat{background:var(--surface-2);color:var(--muted)}
/* charts */
.chart{width:100%;position:relative;min-height:60px}
.chart svg{display:block;overflow:visible;-webkit-tap-highlight-color:transparent}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend i.dash{height:0;border-top:2px dashed currentColor;border-radius:0;width:14px;vertical-align:3px}
/* tooltip */
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.35;max-width:240px;font-variant-numeric:tabular-nums;padding:8px 11px;border-radius:10px;box-shadow:0 8px 24px rgba(18,22,32,.22),0 1px 3px rgba(18,22,32,.16)}
#tip b{font-weight:700}
/* donut + breakdown */
.split{display:grid;gap:16px;align-items:center}
@media (min-width:520px){
  .split{grid-template-columns:180px 1fr}
}
.donut{max-width:180px;margin:0 auto;width:100%}
.brk{display:grid;gap:10px;min-width:0}
.brk-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;min-width:0;border:0;background:none;padding:0;text-align:left}
.brk-row .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brk-row .am{font-weight:600;font-size:14px}
.brk-row .track{grid-column:2/4;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.brk-row .track b{display:block;height:100%;border-radius:6px}
.brk-row .pct{color:var(--muted);font-size:12.5px;font-weight:500;margin-left:4px}
/* category avatar */
/* category tiles */
.av{--c:#888;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-display);font-size:17px;line-height:1;background:color-mix(in srgb,var(--c) var(--tint-a),transparent);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--c) 30%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* transactions */
.tx-day{color:var(--muted);display:flex;justify-content:space-between;font-weight:600;text-transform:uppercase;letter-spacing:.02em;padding:16px 16px 7px;font-size:13px}
.tx-day .num{text-transform:none;letter-spacing:0;font-weight:500}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;background:none;width:100%;text-align:left;border-radius:12px}
.tx:hover{background:var(--surface-2)}
.tx .mid{flex:1;min-width:0;display:grid}
.tx .t1{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.i{color:var(--inc)}
.toolbar{display:grid;gap:10px}
.search{width:100%;border:0;background:var(--surface-2);border-radius:10px;padding:9px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{border:.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 15px;font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent-fill);font-weight:600}
.fdiv{flex:none;width:1px;height:20px;background:var(--line);margin:0 2px}
.more{margin:10px auto 0;display:block}
/* insights */
.ins{display:grid;gap:10px}
.insight{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--surface-2)}
.insight .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.insight.good .ic{background:var(--inc-soft);color:var(--inc)}
.insight.warn .ic{background:var(--warn-soft);color:var(--warn)}
.insight.bad .ic{background:var(--exp-soft);color:var(--exp)}
.insight.info .ic{background:var(--accent-soft);color:var(--accent)}
.insight b.t{display:block}
.insight p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.cmp td:first-child{white-space:normal}
.scroll-x{overflow-x:auto}
/* categories */
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:0}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 14px;font-weight:500;font-size:14px;color:var(--ink);letter-spacing:-.01em}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04)}
.cat-row{display:flex;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:.5px solid var(--line);background:none;width:100%;text-align:left}
.cat-row:last-child{border-bottom:0}
.cat-row .mid{flex:1;min-width:0;display:grid;gap:4px}
.cat-row .t1{font-weight:600}
.cat-row .t2{font-size:12.5px;color:var(--muted)}
.budget{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.budget b{display:block;height:100%;border-radius:6px}
/* fab, sheet, toast */
/* desktop add button folds to a circle while scrolling down and, where there is room, steps out of the column */
.fab{right:max(16px,calc(50% - 474px));bottom:calc(20px + var(--sab));z-index:30;border:0;background:var(--accent-fill);color:var(--accent-ink);height:56px;padding:0 22px 0 18px;border-radius:28px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent-fill) 40%,transparent);position:absolute;transition:padding .2s var(--ease-out),gap .2s var(--ease-out),translate .2s var(--ease-out)}
.fab span{font-size:24px;line-height:1;font-weight:500}
.scrim{position:fixed;inset:var(--vis-t) 0 var(--vis-b);background:rgba(5,8,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
/* sheets: denser */
.sheet{background:var(--sheet);width:100%;max-width:560px;overflow-y:auto;border-radius:13px 13px 0 0;padding:6px 16px calc(20px + var(--sab));display:grid;overscroll-behavior:contain;gap:12px;overflow-x:hidden}
@media (min-width:760px){
  .scrim{align-items:center}
  .sheet{border-radius:16px}
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sheet{animation:none}
}
.grab{width:36px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--label-3) 50%,transparent);margin:0 auto}
.sheet h2{margin:0;font-family:var(--f-body);font-weight:600;letter-spacing:-.02em}
.field{display:grid;gap:6px}
/* add sheet / forms */
.field label,.field .lbl{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.01em;padding-left:4px}
.input{width:100%;border:.5px solid var(--line);background:var(--card-el);border-radius:10px;padding:11px 12px}
.amount-in{font-family:var(--f-display);font-weight:700;letter-spacing:-.04em;border:0;background:transparent;padding:0;width:auto;outline:none;font-size:56px;line-height:1.05;text-align:center;field-sizing:content;min-width:2ch;max-width:100%;font-variant-numeric:tabular-nums;caret-color:var(--accent)}
.amount-box{display:flex;align-items:baseline;justify-content:center;gap:4px;border-bottom:2px solid transparent;padding:6px 0 4px;transition:border-color .15s ease-out}
.amount-box:focus-within{border-color:transparent}
.amount-box span{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.btn.primary{background:var(--accent-fill);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.err{color:var(--exp);font-size:13px;font-weight:600;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px}
.status .dot{width:9px;height:9px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--sab) + var(--vis-b));z-index:90;border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);background:#1B2130;color:#F4F6FB;border:1px solid rgba(255,255,255,.12);white-space:nowrap;max-width:calc(100% - 24px);animation:m-toast-in .26s var(--ease-out)}

/* empty states */
.empty{text-align:center;display:grid;justify-items:center;padding:36px 20px;gap:8px}
.empty h2{margin:0;font-family:var(--f-display);letter-spacing:-.02em}

.muted{color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;min-height:32px}
.mini{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.mini span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.mini b{font-family:var(--f-display);font-size:18px;font-weight:700;white-space:nowrap}
/* notes, table views, sparklines, heatmap, compare, selection, filters */
.how{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:10px 0 0;line-height:1.5}
.how i{flex:none;width:17px;height:17px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px;font-family:var(--f-display)}
.how b{color:var(--ink);font-weight:600}
details.tview{margin-top:8px}
details.tview summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.tview summary::-webkit-details-marker{display:none}
details.tview summary::before{content:"";width:12px;height:9px;border:1.6px solid currentColor;border-radius:2px;box-shadow:inset 0 3px 0 -1.4px currentColor}
details.tview[open] summary{margin-bottom:6px}
details.tview table.cmp{font-size:12.5px}
.spark{width:100%;height:30px;display:block;margin-top:2px}
.ring{flex:none;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--hero-muted);text-align:center}
.ring svg{display:block}
.hero .spark{height:46px;position:relative;z-index:1}
.ins-bar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--muted) 18%,transparent);margin-top:8px;position:relative;overflow:visible}

.ins-bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.tag{font-size:11px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.tx.sel{background:var(--accent-soft)}

.tx.sel .ck{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
/* the check sits on the icon's corner, so entering selection never shifts the rows */
.avw{position:relative;flex:none;display:grid}
.avw .ck{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;font-size:12px;background:var(--surface);box-shadow:0 0 0 2px var(--surface)}
.tx.sel .avw .ck{background:var(--accent-fill)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab) + var(--vis-b));z-index:45;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;display:flex;gap:6px;align-items:center;max-width:calc(100% - 24px);box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700;font-size:14px;overflow-x:auto}
.selbar button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;background:color-mix(in srgb,var(--bg) 16%,transparent);color:inherit;white-space:nowrap}
.selbar span{white-space:nowrap;margin-right:4px}
.selbar button.armed{background:var(--exp);color:#fff}
@media (max-width:640px){
  .selbar{bottom:calc(84px + var(--sab) + var(--vis-b))}
}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:0;border-radius:14px;padding:12px}
.filters .chips{grid-column:1/-1;margin:0;padding:0;flex-wrap:wrap}
.pair-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:2px 0 10px;flex-wrap:wrap}
.pair-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pairs{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.pair .nm{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair .dv{font-family:var(--f-num);font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.pair .bars{grid-column:1/-1;display:grid;gap:3px}
.pair .bars b{display:block;height:7px;border-radius:5px;min-width:2px}
.range4{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center;margin-bottom:10px}
.range4 .tagA,.range4 .tagB{font-weight:800;font-size:12px;border-radius:7px;width:24px;height:24px;display:grid;place-items:center}
.range4 .tagA{background:var(--accent-fill);color:var(--accent-ink)}
.range4 .tagB{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.range4 .input{padding:8px 10px;min-width:0}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat3 .mini b{font-size:16px}
.switch{display:flex;gap:10px;border-radius:12px;background:var(--surface-2);cursor:pointer;padding:8px 12px;align-items:center;border:1px solid transparent}
.switch input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.switch small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.cat-row .share{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cat-row .share b{display:block;height:100%;border-radius:4px}
.stat3 .mini b~span{font-weight:500;font-size:11.5px;margin-top:2px}
.brand i{flex:none}
.bname{overflow:hidden;text-overflow:ellipsis}
/* mobile shell. The page itself never scrolls: only #scroller does, so the bottom bar and the add button
   stay on screen even where the host stretches the frame to the content height (iOS). */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;height:var(--vis-h,100dvh);top:var(--vis-t);display:flex;flex-direction:column;position:relative;overflow:hidden}
/* scrollIntoView leaves room for the day header above and the toast below */
#scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-padding:48px 0 80px}
button,a,input,select,label{touch-action:manipulation}
@media (hover:none){
  .tx:hover{background:none}

}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:44px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.row2>*,.range-in>*,.range4>*{min-width:0}
.sheet{max-height:92vh;max-height:92dvh;max-height:calc(var(--vis-h,100dvh)*.92)}
/* keep Save reachable without scrolling past long category lists */
.sheet>.actions:last-child{position:sticky;bottom:calc(-20px - var(--sab));background:var(--sheet);margin:0 -16px calc(-20px - var(--sab));padding:12px 16px calc(16px + var(--sab));border-top:.5px solid var(--line);z-index:2}

  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;letter-spacing:.01em;color:var(--muted);padding:4px 0;min-height:48px;justify-content:center;position:relative;-webkit-user-select:none;user-select:none}

  .bnav .bplus svg{width:22px;height:22px}
  #toast{bottom:calc(84px + var(--sab) + var(--vis-b))}
  .selbar{bottom:calc(84px + var(--sab) + var(--vis-b));left:12px;right:12px;transform:none;max-width:none;justify-content:space-between;flex-wrap:wrap;overflow:visible;padding:10px}
  /* 16px stops iOS from zooming into fields when they get focus */

.ctile .cn{font-size:12px;font-weight:500;line-height:1.2;text-align:center;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;-webkit-hyphens:auto;hyphens:auto;min-height:2.4em;max-width:100%;letter-spacing:-.01em}

/* Summary: category strip + backup line */
.mix{display:grid;gap:10px;background:var(--surface);border-radius:14px;padding:14px 16px}
.mix-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);gap:2px}
.mix-bar b{display:block;height:100%;min-width:3px}
.mix-chips{display:flex;gap:6px;flex-wrap:wrap}
.mix-chips .chip{padding:0 12px 0 4px;font-size:14.5px;background:var(--surface-2);border-color:transparent}
.mix-chips .chip .ci{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:15px;line-height:1}
.mix-chips .chip.over{border-color:var(--exp);color:var(--exp)}
.mix-chips .chip .num{font-family:var(--f-num)}
.idle-cats summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:12px 4px;min-height:44px;display:flex;align-items:center}
.sync-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;padding:6px 12px;border-radius:12px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.sync-line b{color:var(--warn)}
.sync-line .link{font-size:13px;min-height:40px;padding:0 6px;margin-left:auto}
.sync-line .link+.link{margin-left:0}
.sync-line.bad{background:color-mix(in srgb,var(--exp) 12%,transparent);border-color:color-mix(in srgb,var(--exp) 30%,transparent)}
.sync-line.bad b{color:var(--exp)}
.bk-line{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:2px 2px 2px 14px;background:var(--surface);border-radius:12px}
.bk-line .link{font-size:13px;min-height:40px;padding:0 6px;white-space:nowrap}
.bk-line .x{border:0;background:none;color:var(--muted);width:40px;height:40px;margin-left:auto;font-size:18px;flex:none}
.bk-line span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Transactions */
.mv-top{display:flex;gap:8px;align-items:center}
.mv-top .search{flex:1;min-width:0;min-height:40px;padding-left:36px;background-image:var(--sic);background-repeat:no-repeat;background-position:10px 50%;background-size:18px 18px}
.mv-top{--sic:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%236C6C70%27 stroke-width=%272%27 stroke-linecap=%27round%27%3E%3Ccircle cx=%2710.6%27 cy=%2710.6%27 r=%276%27/%3E%3Cpath d=%27m15.2 15.2 4.3 4.3%27/%3E%3C/svg%3E")}
.mv-top .icon-btn{width:40px;height:40px;border-radius:50%;position:relative}
.mv-top .icon-btn[aria-pressed="true"],.mv-top .icon-btn[aria-expanded="true"]{background:var(--accent-fill);color:var(--accent-ink);border-color:var(--accent-fill)}
.icon-btn .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent-fill);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.mv-sum{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:13.5px;color:var(--muted);padding:0 2px}
.mv-sum b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
.mv-sum .link{font-size:13.5px;min-height:32px;margin-left:auto}
.seg.full{display:flex}
.seg.full button{flex:1}
/* Analysis sub-nav */
.subnav{display:flex;gap:8px;background:none;border-radius:0;padding:0 16px;margin-inline:-16px;overflow-x:auto;scrollbar-width:none;--thumb:var(--accent-fill)}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:0;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line);border-radius:18px;padding:0 15px;min-height:36px;font-weight:500;font-size:15px;color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.subnav button[aria-pressed="true"]{background:var(--accent-fill);color:var(--accent-ink);box-shadow:none;font-weight:600}
.card .insight{background:none;border-radius:0;padding:10px 0;border-top:1px solid var(--line);gap:10px;align-items:center}
.card .insight:first-child{border-top:0;padding-top:2px}
.card .ins{gap:0}
.insight b.t{font-size:14px;font-weight:600}
.insight .ins-bar{margin-top:6px}
.card h3+.sub{margin-top:0}
.kpi .spark{height:32px}
.tx .t1.wrap{white-space:normal;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .tx{padding:8px 0}
.card .tx .av{width:30px;height:30px;border-radius:7px;font-size:16px}
.sheet h2{font-size:17px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid button{border:.5px solid var(--line);background:var(--card-el);border-radius:12px;padding:8px 12px;text-align:left;display:grid;gap:1px;min-height:52px}
.pgrid b{font-size:14.5px}
.pgrid small{font-size:12px;color:var(--muted)}
.pgrid button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.rows{display:grid;border:0;border-radius:12px;overflow:hidden;background:var(--card-el)}
.rowi{display:flex;align-items:center;gap:12px;border:0;border-top:.5px solid var(--line);background:none;padding:8px 14px;min-height:52px;text-align:left;width:100%}
.rowi:first-child{border-top:0}
.rowi .ri{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-fill);color:#fff;flex:none}
.rowi .ri svg{width:18px;height:18px}
.rowi .rt{flex:1;min-width:0;display:grid}
.rowi .rt b{font-weight:600}
.rowi .rt small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi::after{content:"›";color:var(--muted);font-size:20px;line-height:1}
.rowi[aria-current="page"] b{color:var(--accent)}
.sline{font-size:13px;color:var(--muted);margin:0;display:flex;gap:8px;align-items:center}
@media (min-width:360px){
  .ctiles{grid-template-columns:repeat(5,minmax(0,1fr))}
}
.ctile .cn,.ctile .cn.long{font-size:11px;letter-spacing:-.03em;min-height:0;display:block;white-space:nowrap;overflow:hidden;line-height:1.25;max-width:calc(100% + 8px);margin-inline:-4px;text-align:center}
.ctile[aria-pressed="true"]{background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
details.opts summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center;gap:6px}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::after{content:"▾";font-size:12px}
details.opts[open] summary::after{content:"▴"}
details.opts>div{display:grid;gap:12px}
.bar{gap:8px}
.brand{gap:8px}
section.view>*{min-width:0}
@media (max-width:380px){
  .subnav button{padding:0 13px;font-size:15px}
  .range-in{grid-template-columns:1fr}
}
.stat3.tight{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat3.tight .mini{display:grid;gap:2px;align-content:start;padding:8px 10px}
.stat3.tight .mini>span:first-child{font-size:11.5px;line-height:1.25}
.stat3.tight .mini b{font-size:15px;white-space:normal}
@media (max-width:340px){
  .subnav button{padding:0 11px;font-size:14px}
}
.stat3.tight .mini b~span{flex-basis:auto;font-size:11px}
/* r2 fixes */
.actions .err{flex:1 1 100%;margin:0 0 2px}
#f-cats.bad{outline:2px solid var(--exp);outline-offset:4px;border-radius:14px}
.amount-box.bad{border-color:var(--exp)}
#toast span{overflow:hidden;text-overflow:ellipsis}
/* forecast card */
.fc{display:grid;gap:6px;text-align:left;width:100%;border:0;background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);color:var(--ink)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* forecast: the big figure is red only when the month runs above a normal one */
.fc-big{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.035em;line-height:1.05;color:var(--ink);margin-top:2px}
.fc-rng{font-size:13.5px;color:var(--muted);line-height:1.35}
.fc-bar{position:relative;display:flex;height:10px;border-radius:5px;background:var(--surface-2);margin:8px 0 4px}
.fc-bar b{height:100%;display:block}
.fc-bar b:first-child{border-radius:5px 0 0 5px}
.fc-bar b:last-of-type{border-radius:0 7px 7px 0}
.fc-bar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:1;border-radius:1px}
.fc-leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.fc-leg>span{display:flex;align-items:center;gap:0;white-space:nowrap;min-width:0}
.fc-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;flex:none}
.fc-leg b{color:var(--ink);font-weight:600;margin-left:auto;padding-left:6px}
/* radii: --r-lg for top-level surfaces, --r for inner panels/inputs, --r-sm for small tiles */
.card,.kpi,.fc{border-radius:var(--r-lg)}
.filters,.status,.rows,.insight,.mini{border-radius:var(--r)}
.pgrid button,.icn{border-radius:12px}
.how,details.how p{border-radius:var(--r-sm)}
.card h3{line-height:1.25}
/* segmented controls: the selected thumb sits above the track in both themes (dark used to look sunken) */
.seg button[aria-pressed="true"]{background:var(--raise)}
.seg button,.subnav button,.tab,.chip,.pill-btn,.icon-btn,.btn,.link,.rowi,.pgrid button,.ctile,.icn,.alert,.fc,.mnav button,.sw{transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out,box-shadow .15s ease-out}
/* hover only on devices that really hover (no sticky hover on touch) */
@media (hover:hover){
  .tab:not([aria-selected="true"]):hover{background:var(--hover);color:var(--ink)}
  .seg button:not([aria-pressed="true"]):hover,.subnav button:not([aria-pressed="true"]):hover{color:var(--ink)}
  .chip:not([aria-pressed="true"]):hover,.pill-btn:hover,.icon-btn:not([aria-pressed="true"]):not([aria-expanded="true"]):hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line));background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
  .btn.primary:hover{background:color-mix(in srgb,var(--accent-fill) 88%,var(--ink))}
  .btn.ghost:hover{background:color-mix(in srgb,var(--ink) 8%,var(--surface-2))}
  .btn.danger:hover{background:color-mix(in srgb,var(--exp) 16%,var(--exp-soft))}
  .link:hover{text-decoration:underline;text-underline-offset:3px}
  .pgrid button:not([aria-pressed="true"]):hover,.alert:hover,.fc:hover{border-color:color-mix(in srgb,var(--ink) 20%,var(--line))}
  .rowi:hover{background:var(--hover)}
  .ctile:not([aria-pressed="true"]):hover,.icn:not([aria-pressed="true"]):hover{background:var(--surface-2)}
  .mnav button:not([aria-pressed="true"]):hover{color:var(--ink)}
  .tx:hover{background:var(--hover)}
  .tx.sel:hover{background:var(--accent-soft)}
  .card .txg .tx:hover{background:color-mix(in srgb,var(--ink) 5%,var(--surface-2))}
}
/* rows inside grouped lists: the hover/press background gets a little room around the avatar */
.txg .tx,.card .tx{margin-inline:-8px;padding-inline:8px;width:calc(100% + 16px)}
/* disabled */
.btn:disabled,.chip:disabled,.pill-btn:disabled,.icon-btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
/* focus: one ring everywhere; fields get a soft halo instead of a hard outline */
.tab:focus-visible,.chip:focus-visible,.seg button:focus-visible,.subnav button:focus-visible,.btn:focus-visible,.pill-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.input,.search,textarea.dump{transition:border-color .15s ease-out,box-shadow .15s ease-out}
.input:focus,.search:focus,textarea.dump:focus,select.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.input::placeholder,.search::placeholder,.amount-in::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
.sheet h2{line-height:1.2}
.sh-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:0 -8px;min-height:44px}
.sh-bar h2{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{border:0;background:none;color:var(--accent);font-size:17px;letter-spacing:-.01em;padding:0 8px;min-height:44px;justify-self:start;white-space:nowrap}
.navbtn.b{font-weight:600;justify-self:end}
.sheet .seg.full{margin-inline:24px}
@media (max-width:360px){
  .sh-bar{margin-inline:-4px;grid-template-columns:auto minmax(0,1fr) auto}
  .sh-bar h2{font-size:15px}
  .navbtn{font-size:16px;padding:0 2px}
}
.ctile[aria-pressed="true"] .cn{font-weight:700}
.switch:has(input:checked){border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface-2))}
.pgrid button[aria-pressed="true"] b{color:var(--accent)}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 22%,var(--line))}
.alert.bad{border-color:color-mix(in srgb,var(--exp) 22%,var(--line))}
.alert.good{border-color:color-mix(in srgb,var(--inc) 22%,var(--line))}
.alert.info{border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
.empty h2{font-size:20px;line-height:1.2}
.empty p{font-size:14px;line-height:1.5}
.txlist>.empty,.txlist>.card.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);box-shadow:none;padding:28px 16px}
/* dark: chips/tabs selected as a soft light pill instead of a glaring white block */
:root[data-theme="dark"] .seg button[aria-pressed="true"]{box-shadow:none}
.chart text{font-variant-numeric:tabular-nums}
/* hidden "before" state while a chart waits to scroll into view (JS adds .ch-wait, then .ch-run) */
.ch-wait .ch-col{transform:scaleY(0)}
.ch-wait .ch-reveal,.ch-wait.spark>*{clip-path:inset(-12px 100% -12px -12px)}
.ch-wait .ch-sweep{stroke-dashoffset:100}
.ch-wait .ch-mid,.ch-wait .ch-cell{opacity:0}
.ch-wait .ch-arc{stroke-dashoffset:var(--len)}
.ch-wait .track b,.ins-bar.ch-wait>b{transform:scaleX(0)}
/* bars grow from the zero line, column by column */
.ch-col{transform-box:view-box}
.ch-run .ch-col{animation:ch-grow .38s var(--ch-ease) backwards;animation-delay:min(calc(var(--i) * 16ms),220ms)}
@keyframes ch-grow{from{transform:scaleY(0)}}
/* lines (and the line over bars) draw left to right */
.ch-run .ch-reveal{animation:ch-wipe .4s var(--ch-ease) backwards}
.ch-run .ch-col~.ch-reveal{animation-delay:.16s}
.ch-run.spark>*{animation:ch-wipe .4s var(--ch-ease) backwards}
@keyframes ch-wipe{from{clip-path:inset(-12px 100% -12px -12px)}to{clip-path:inset(-12px -12px -12px -12px)}}
/* donut sweeps clockwise from 12 o'clock; the total fades in */
.ch-run .ch-sweep{animation:ch-sweep .42s var(--ch-ease) backwards}
@keyframes ch-sweep{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.ch-run .ch-mid{animation:ch-fade .3s ease-out .12s backwards}
@keyframes ch-fade{from{opacity:0}}
/* calendar cells fade in week by week */
.ch-run .ch-cell{animation:ch-fade .24s ease-out backwards;animation-delay:min(calc(var(--i) * 7ms),200ms)}
/* hero ring, breakdown and insight bars */
.ch-run .ch-arc{animation:ch-arc .42s var(--ch-ease) .08s backwards}
@keyframes ch-arc{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.brk .track b,.ins-bar>b{transform-origin:left center}
.ch-run .track b,.ins-bar.ch-run>b{animation:ch-fill .38s var(--ch-ease) backwards}
.ch-run .brk-row:nth-child(2) .track b{animation-delay:30ms}
.ch-run .brk-row:nth-child(3) .track b{animation-delay:60ms}
.ch-run .brk-row:nth-child(4) .track b{animation-delay:90ms}
.ch-run .brk-row:nth-child(n+5) .track b{animation-delay:120ms}
@keyframes ch-fill{from{transform:scaleX(0)}}
/* hover / tap focus: a soft column band, the hovered donut slice stands out, the hovered day is outlined */
.chart rect.hot:not(.ch-cell){fill:color-mix(in srgb,var(--ink) 6%,transparent)}
.ch-segs path{transition:opacity .15s ease-out}
svg.has-hot .ch-segs path:not(.hot){opacity:.38}
.chart rect.ch-cell.hot{stroke:var(--ink);stroke-width:1.5}
#tip:not([hidden]){animation:ch-tip .14s ease-out}
@keyframes ch-tip{from{opacity:0;transform:translateY(3px)}}
:root[data-theme="dark"] #tip{box-shadow:0 8px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion: reduce){
  .ch-col,.ch-reveal,.spark>*,.ch-sweep,.ch-mid,.ch-cell,.ch-arc,.brk .track b,.ins-bar>b{animation:none!important}
  .ch-wait .ch-col,.ch-wait .track b,.ins-bar.ch-wait>b{transform:none}
  .ch-wait .ch-reveal,.ch-wait.spark>*{clip-path:none}
  .ch-wait .ch-sweep,.ch-wait .ch-arc{stroke-dashoffset:0}
  .ch-wait .ch-mid,.ch-wait .ch-cell{opacity:1}
  .ch-segs path{transition:none}
  #tip:not([hidden]){animation:none}
}
/* view enter: tab / sub-view / period / first load (rises), month change (slides from the side it comes from) */
.m-in,.m-in-x{animation:m-in .28s var(--ease-out) backwards;animation-delay:calc(var(--mi,0) * 32ms)}
.m-in-x{animation-name:m-in-x}
@keyframes m-in{from{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes m-in-x{from{opacity:0;transform:translate3d(calc(var(--mdx,1) * 22px),0,0)}}
.sheet{animation:m-sheet-in .32s var(--ease-out)}
@keyframes m-fade{from{opacity:0}}
@keyframes m-sheet-in{from{transform:translateY(100%)}}
.scrim.closing{pointer-events:none}
.scrim.closing .sheet{animation:m-sheet-out .22s var(--ease-in) forwards}
/* the drag-to-close gesture already moved the sheet off-screen: only fade the scrim */
.scrim.closing .sheet[data-dragged]{animation:none}
@keyframes m-fade-out{to{opacity:0}}
@keyframes m-sheet-out{to{transform:translateY(100%)}}
@media (min-width:760px){
  .sheet{animation-name:m-pop-in;animation-duration:.24s}
  .scrim.closing .sheet{animation-name:m-pop-out;animation-duration:.18s}
  @keyframes m-pop-in{from{opacity:0;transform:translateY(16px) scale(.98)}}
  @keyframes m-pop-out{to{opacity:0;transform:translateY(12px) scale(.98)}}
}
/* toast: fix — display:flex beat [hidden], leaving an empty dark pill above the nav */
#toast[hidden]{display:none}
#toast.out{animation:m-toast-out .18s var(--ease-in) forwards}
@keyframes m-toast-in{from{opacity:0;transform:translate(-50%,12px) scale(.96)}}
@keyframes m-toast-out{to{opacity:0;transform:translate(-50%,8px) scale(.97)}}
/* press feedback on buttons (rows, bottom nav and FAB have their own) — uses `scale`, so it never fights a transform */
button:not(:disabled):not(.tx):not(.cat-row):not(.menu-item):not(.bnav button):not(.fab):active{animation:m-press .1s ease-out forwards}
@keyframes m-press{to{scale:.96}}
/* hero numbers count without the layout shaking */
.flow-h .big,.fl-p .num,.fc-big,.kpi .val{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){
  .m-in,.m-in-x{animation:m-fade .14s ease-out backwards;animation-delay:0s}
  .sheet,.scrim.closing .sheet{animation:none}
  .scrim.closing{animation-duration:.12s}
  #toast{animation:m-fade .12s ease-out}
  #toast.out{animation:m-fade-out .12s ease-out forwards}
  button:not(:disabled):active{animation:none}
}
/* bottom nav: sliding active indicator (a soft pill behind the icon; JS sets its position) */
.bnav-ind{display:none}
@media (max-width:640px),(pointer:coarse) and (max-width:932px){
  .bnav-ind{display:block;position:absolute;left:0;top:0;width:56px;height:30px;border-radius:999px;background:var(--accent-soft);z-index:-1;opacity:0;pointer-events:none;will-change:transform}

  .bnav-ind.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s cubic-bezier(.2,.8,.2,1),opacity .2s ease-out}

  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sheet>.actions:last-child{margin-inline:-16px;padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){
  .bnav-ind.anim{transition:opacity .12s linear}
  .bnav button svg,.bnav .bplus span{transition:none}
  .bnav button:active svg,.bnav .bplus:active span{transform:none}

/* landscape phones: short viewport, so a slimmer bar with icon and label side by side */
@media (pointer:coarse) and (orientation:landscape) and (max-height:500px){
  .bnav{padding-top:2px;padding-bottom:max(2px,var(--sab))}
  .bnav button{flex-direction:row;gap:6px;min-height:44px;font-size:12.5px}
  .bnav .bplus span{width:46px;height:32px;border-radius:16px;margin-top:0;box-shadow:none}

<script>
(() => {
"use strict";
/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let NF, NF0;
try { NF = new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR", useGrouping: "always" }); NF0 = new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR", maximumFractionDigits: 0, useGrouping: "always" }); }
catch (e) { NF = new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR" }); NF0 = new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }); }
const minus = s => s.replace(/^-|(\s)-/g, "$1−");
const eur = v => minus(NF.format(Math.round((v || 0) * 100) / 100 || 0));
const eur0 = v => minus(NF0.format(Math.round(v || 0) || 0));
// signed amount: "+12 €", "−12 €", never "−0 €"
const sgn = (v, f = eur0) => { const r = f === eur0 ? Math.round(v) : Math.round(v * 100) / 100; return (r > 0 ? "+" : r < 0 ? "−" : "") + f(Math.abs(r)); };
// chip amounts: cents below 10 €
const pct = v => minus((isFinite(v) ? (v * 100).toFixed(Math.abs(v) < 0.1 ? 1 : 0) : "0") + "%");
const compact = v => { const a = Math.abs(v); return a >= 1000 ? (v / 1000).toFixed(a >= 10000 ? 0 : 1) + "k" : Math.round(v) + ""; };
const MES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MESL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
// month names that notes may carry (English and Spanish), stripped when comparing notes
const MONTH_WORDS = ["january", "february", "march", "april", "june", "july", "august", "september", "october", "november", "december", "jan", "feb", "apr", "jun", "jul", "aug", "sep", "sept", "oct", "nov", "dec",
  "enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre", "ene", "abr", "ago", "dic"];
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseYM = k => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 1);
const addM = (k, n) => { const d = parseYM(k); d.setMonth(d.getMonth() + n); return ym(d); };
const mLabel = (k, yr) => MES[+k.slice(5, 7) - 1] + (yr ? " " + k.slice(2, 4) : "");
// the year shows only where it is needed: when the months span two years or are not this year
const needYear = ks => ks.some(k => k.slice(0, 4) !== String(new Date().getFullYear()));
const mLabels = ks => { const y = needYear(ks); return ks.map((k, i) => { const m = +k.slice(5, 7); return MES[m - 1] + (y && (m === 1 || i === 0) ? " " + k.slice(2, 4) : ""); }); };
const mFull = k => `${MESL[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}`;
const daysIn = k => new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate();
const monthsBetween = (a, b) => { const r = []; for (let k = a; k <= b; k = addM(k, 1)) r.push(k); return r; };

const sum = (l, f = t => t.a) => l.reduce((s, t) => s + f(t), 0);

/* ---------- keep the whole app on screen ----------

   page can stay scrolled a little (after the keyboard, a rotation or the Safari bars moving), so the top or the
   bottom of the frame falls outside the screen and the bottom bar is cut. So: snap any page scroll back to 0, and
   measure which slice of the frame is really visible (an IntersectionObserver sees the clipping by the host and the
   screen even inside a cross-origin frame). When part is cut off, the app moves into that slice: --vis-t (offset
   from the top), --vis-h (height) and --vis-b (cut at the bottom, for the toast, the selection bar and the sheets).
   The probe is a fixed full-height box that never moves with the app, so every reading starts from scratch, and we
   read again on any touch, on resize/rotation/return and every 2 s while visible, because WebKit does not always
   report a change in the host. On desktop only a cut bottom with the top in view counts (an inline preview the

     Measured 2026-11-19 on an iPhone with a 402x874 screen: frame 834 tall under a ~40 px host bar, bottom bar
