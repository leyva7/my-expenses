<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14203D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C56CF'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E€%3C/text%3E%3C/svg%3E">
<title>Mis Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<script>(function(){try{var u=navigator.userAgent,t=navigator.maxTouchPoints>1,ip=/iPhone/.test(u),pad=/iPad/.test(u)||(/Macintosh/.test(u)&&t),big=Math.max(screen.width,screen.height)>=812;if((ip&&big)||pad)document.documentElement.classList.add('ios-hi')}catch(e){}})()</script>
<style>
/* v13: bottom safe area. Inside the claude.ai frame iOS reports env(safe-area-inset-bottom)=0, so on iPhones/iPads
   with a home indicator we keep a minimum gap and the bottom bar stays clear of the swipe-home gesture. */
:root{--sab-min:0px;--sab:max(env(safe-area-inset-bottom,0px),var(--sab-min))}
html.ios-hi{--sab-min:22px}
@media (orientation:landscape){html.ios-hi{--sab-min:14px}}

/* Layout (shares tokens, fonts and mobile patterns with the Cartera tracker): one mobile column (max 980px), sticky header + scrollable tab strip, cards stack; 2 columns from 760px. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EDF0F5; --ink:#121620; --muted:#687085; --line:#DDE1E8;
  --accent:#1C56CF; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB;
  --hero:#14203D; --hero-ink:#F4F6FB; --hero-muted:#A9B4CF;
  --inc:#0A7639; --inc-soft:#E2F3E8; --exp:#C02F2F; --exp-soft:#FBE6E6; --warn:#8A5A00; --warn-soft:#FFF3D6;
  --shadow:0 1px 2px rgba(18,22,32,.06),0 4px 16px rgba(18,22,32,.05);
  --f-display:"Schibsted Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:var(--f-body);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#151920; --surface-2:#1C212A; --ink:#E8EBF1; --muted:#8C95A5; --line:#29303B;
  --accent:#6AA2F4; --accent-ink:#0D1015; --accent-soft:#1A2740;
  --hero:#1A2740; --hero-ink:#F4F6FB; --hero-muted:#A9B4CF;
  --inc:#46CC7E; --inc-soft:#12291C; --exp:#F27676; --exp-soft:#2E1718; --warn:#F1B84F; --warn-soft:#2B2310;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151920; --surface-2:#1C212A; --ink:#E8EBF1; --muted:#8C95A5; --line:#29303B;
  --accent:#6AA2F4; --accent-ink:#0D1015; --accent-soft:#1A2740;
  --hero:#1A2740; --hero-ink:#F4F6FB; --hero-muted:#A9B4CF;
  --inc:#46CC7E; --inc-soft:#12291C; --exp:#F27676; --exp-soft:#2E1718; --warn:#F1B84F; --warn-soft:#2B2310;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.amt,.kpi .val,.mini b,.brk-row .am,table.cmp td,.tx-day .num,.hchip b,.fl-p,.pair .dv{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:12px 8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap}
#periodBtn{min-width:0;max-width:46vw}
.bar .brand{flex:1 1 auto}#periodLbl{overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand{font-size:19px}.brand i{width:28px;height:28px}}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:17px}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.icon-btn svg{width:18px;height:18px}
.range-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yr td:first-child{font-weight:700}

main{padding-block:16px 120px}
.bnav{display:none}
@media (max-width:640px){
  header.top .tabs{display:none}
  .fab{display:none!important}
  main{padding-bottom:calc(100px + var(--sab))}
  #toast{bottom:calc(84px + var(--sab))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;min-height:48px;justify-content:center}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav .bplus span{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent);margin-top:-16px}
  .bnav .bplus svg{width:24px;height:24px}
}
section.view{display:grid;gap:14px}
.grid2{display:grid;gap:14px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;text-wrap:balance}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.05)}
.hero .eyebrow{color:var(--hero-muted)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,48px);letter-spacing:-.03em;line-height:1}
.hero-row{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.hchip{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;display:grid;gap:1px;min-width:0;flex:1 1 130px}
.hchip span{font-size:12px;color:var(--hero-muted)}
.hchip b{font-family:var(--f-display);font-size:19px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:4px;min-width:0;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;justify-self:start;white-space:nowrap}
.delta.good{background:var(--inc-soft);color:var(--inc)}
.delta.bad{background:var(--exp-soft);color:var(--exp)}
.delta.flat{background:var(--surface-2);color:var(--muted)}

/* charts */
.chart{width:100%;position:relative;min-height:60px}
.chart svg{display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed currentColor;border-radius:0;width:14px;vertical-align:3px}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:10px;font-size:12.5px;line-height:1.35;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#tip b{font-weight:700}

/* donut + breakdown */
.split{display:grid;gap:16px;align-items:center}
@media (min-width:520px){.split{grid-template-columns:180px 1fr}}
.donut{max-width:180px;margin:0 auto;width:100%}
.brk{display:grid;gap:10px;min-width:0}
.brk-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;min-width:0;border:0;background:none;padding:0;text-align:left}
.brk-row .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brk-row .am{font-weight:600;font-size:14px}
.brk-row .track{grid-column:2/4;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.brk-row .track b{display:block;height:100%;border-radius:6px}
.brk-row .pct{color:var(--muted);font-size:12.5px;font-weight:500;margin-left:4px}

/* category avatar */
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;font-family:var(--f-display)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* transactions */
.tx-day{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;padding:14px 2px 6px;text-transform:capitalize}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;background:none;width:100%;text-align:left;border-radius:12px}
.tx:hover{background:var(--surface-2)}
.tx .mid{flex:1;min-width:0;display:grid}
.tx .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.i{color:var(--inc)}
.toolbar{display:grid;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.more{margin:10px auto 0;display:block}

/* insights */
.ins{display:grid;gap:10px}
.insight{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--surface-2)}
.insight .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.insight.good .ic{background:var(--inc-soft);color:var(--inc)}
.insight.warn .ic{background:var(--warn-soft);color:var(--warn)}
.insight.bad .ic{background:var(--exp-soft);color:var(--exp)}
.insight.info .ic{background:var(--accent-soft);color:var(--accent)}
.insight b.t{display:block;font-size:14.5px}
.insight p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}

table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.cmp td:first-child{white-space:normal}
.scroll-x{overflow-x:auto}

/* categories */
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cat-row{display:flex;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.cat-row:last-child{border-bottom:0}
.cat-row .mid{flex:1;min-width:0;display:grid;gap:4px}
.cat-row .t1{font-weight:600}
.cat-row .t2{font-size:12.5px;color:var(--muted)}
.budget{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.budget b{display:block;height:100%;border-radius:6px}

/* fab, sheet, toast */
.fab{position:fixed;right:max(16px,calc(50% - 474px));bottom:calc(20px + var(--sab));z-index:30;border:0;background:var(--accent);color:var(--accent-ink);height:56px;padding:0 22px 0 18px;border-radius:18px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab span{font-size:24px;line-height:1;font-weight:500}
.scrim{position:fixed;inset:0;background:rgba(5,8,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + var(--sab));display:grid;gap:14px;animation:up .22s ease-out}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.sheet h2{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:-.02em}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px}
.amount-in{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;border:0;background:transparent;padding:0;width:100%;outline:none}
.amount-box{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount-box:focus-within{border-color:var(--accent)}
.amount-box span{font-family:var(--f-display);font-size:26px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catgrid{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.err{color:var(--exp);font-size:13px;font-weight:600;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.menu-list{display:grid;gap:8px}
.menu-item{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px}
.menu-item b{display:block}
.menu-item small{color:var(--muted)}
.status{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px}
.status .dot{width:9px;height:9px}
textarea.dump{width:100%;min-height:140px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--sab));z-index:90;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast button{border:0;background:transparent;color:var(--accent);font-weight:800;filter:brightness(1.4)}
.empty{text-align:center;padding:40px 16px;display:grid;gap:10px;justify-items:center}
.empty h2{margin:0;font-family:var(--f-display);font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.muted{color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
.stack{display:grid;gap:4px}
.mini-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mini{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.mini span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.mini b{font-family:var(--f-display);font-size:18px;font-weight:700;white-space:nowrap}
/* v3: notes, table views, sparklines, heatmap, compare, selection, filters */
.how{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:10px 0 0;line-height:1.5}
.how i{flex:none;width:17px;height:17px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-style:normal;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px;font-family:var(--f-display)}
.how b{color:var(--ink);font-weight:600}
details.tview{margin-top:8px}
details.tview summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.tview summary::-webkit-details-marker{display:none}
details.tview summary::before{content:"";width:12px;height:9px;border:1.6px solid currentColor;border-radius:2px;box-shadow:inset 0 3px 0 -1.4px currentColor}
details.tview[open] summary{margin-bottom:6px}
details.tview table.cmp{font-size:12.5px}
.spark{width:100%;height:30px;display:block;margin-top:2px}
.hero-top{display:flex;gap:14px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.ring{flex:none;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--hero-muted);text-align:center}
.ring svg{display:block}
.hero .spark{height:46px;position:relative;z-index:1}
.ins-bar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--muted) 18%,transparent);margin-top:8px;position:relative;overflow:visible}
.ins-bar b{display:block;height:100%;border-radius:6px}
.ins-bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.tag{font-size:11px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.tx.sel{background:var(--accent-soft)}
.tx .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:transparent}
.tx.sel .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--sab));z-index:45;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;display:flex;gap:6px;align-items:center;max-width:calc(100% - 24px);box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700;font-size:14px;overflow-x:auto}
.selbar button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;background:color-mix(in srgb,var(--bg) 16%,transparent);color:inherit;white-space:nowrap}
.selbar span{white-space:nowrap;margin-right:4px}
@media (max-width:640px){.selbar{bottom:calc(84px + var(--sab))}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.filters .chips{grid-column:1/-1;margin:0;padding:0;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);font-size:13.5px}
.banner b{color:var(--warn)}
.pair-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:2px 0 10px;flex-wrap:wrap}
.pair-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pairs{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.pair .nm{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair .dv{font-family:var(--f-num);font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.pair .bars{grid-column:1/-1;display:grid;gap:3px}
.pair .bars b{display:block;height:7px;border-radius:5px;min-width:2px}
.range4{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center;margin-bottom:10px}
.range4 .tagA,.range4 .tagB{font-weight:800;font-size:12px;border-radius:7px;width:24px;height:24px;display:grid;place-items:center}
.range4 .tagA{background:var(--accent);color:var(--accent-ink)}
.range4 .tagB{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.range4 .input{padding:8px 10px;min-width:0}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat3 .mini b{font-size:16px}
.switch{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);cursor:pointer}
.switch input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.switch small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.sugg{font-size:12.5px;color:var(--accent);font-weight:600}
.cat-row .share{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cat-row .share b{display:block;height:100%;border-radius:4px}
.sect-h{display:flex;align-items:center;gap:10px;margin:6px 2px -4px}
.sect-h span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line)}
.kpi .val{line-height:1.15}
.stat3 .mini b~span{font-weight:500;font-size:11.5px;margin-top:2px}

.brand i{flex:none}.bname{overflow:hidden;text-overflow:ellipsis}
#periodBtn{flex:0 1 auto}
/* v4: mobile shell. The page itself never scrolls: only #scroller does, so the bottom bar and the add button
   stay on screen even where the host stretches the frame to the content height (iOS). */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
header.top{position:relative;top:auto;flex:none;padding-top:env(safe-area-inset-top,0px)}
#scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.fab{position:absolute}
button,a,input,select,label{touch-action:manipulation}
@media (hover:none){.tx:hover{background:none}.tx.sel:hover{background:var(--accent-soft)}}
.link{padding:6px 0;min-height:32px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;min-height:44px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.row2>*,.range-in>*,.range4>*{min-width:0}
.sheet{max-height:92vh;max-height:92dvh;overscroll-behavior:contain}
/* keep Guardar reachable without scrolling past long category lists */
.sheet>.actions:last-child{position:sticky;bottom:calc(-20px - var(--sab));background:var(--surface);margin:0 -18px calc(-20px - var(--sab));padding:12px 18px calc(16px + var(--sab));border-top:1px solid var(--line);z-index:2}
@media (max-width:640px),(pointer:coarse) and (max-width:932px){
  header.top .tabs{display:none}
  .fab{display:none!important}
  main{padding-bottom:28px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:relative;flex:none;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;min-height:48px;justify-content:center}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav .bplus span{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent);margin-top:-14px}
  .bnav .bplus svg{width:24px;height:24px}
  #toast{bottom:calc(84px + var(--sab))}
  .selbar{bottom:calc(84px + var(--sab))}
  /* 16px stops iOS from zooming into fields when they get focus */
  .input,.search,select,textarea{font-size:16px}
  .card{padding:14px}
  .stat3{grid-template-columns:1fr;gap:6px}
  .stat3 .mini{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
  .stat3 .mini>span:first-child{flex:1 1 auto}
  .stat3 .mini b~span{flex-basis:100%;margin:0}
  .range4{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px 6px}
  .range4 .input{padding:8px 6px;font-size:14px}
  .filters{grid-template-columns:1fr 1fr}
  .tools .pill-btn{padding:8px 12px}
  .sheet{padding-inline:16px}
  .actions .btn{flex:1 1 120px;min-height:48px}
  .selbar{left:12px;right:12px;transform:none;max-width:none;justify-content:space-between}
  .selbar{flex-wrap:wrap;overflow:visible;padding:10px}
  .selbar span{flex:1 1 100%;margin:0 0 2px 4px}
  .selbar button{padding:9px 10px;flex:1 1 auto}
}
@media (max-width:360px){
  .brand{font-size:17px;gap:6px}.brand i{width:26px;height:26px;font-size:15px}
  .bar{gap:6px}.icon-btn{width:34px;height:34px}
  #periodBtn{padding:6px 10px;max-width:60vw}
  .kpi .val{font-size:18px}
  .hero .big{font-size:32px}
  .ring svg{width:64px;height:64px}
  .range4 .input{font-size:13px;padding:8px 4px}
}

/* category tiles */
.av{font-size:19px;line-height:1}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px}
.ctile{border:1.5px solid transparent;background:var(--surface-2);border-radius:14px;padding:8px 2px 7px;display:grid;justify-items:center;gap:5px;min-width:0}
.ctile .ci{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;line-height:1;background:color-mix(in srgb,var(--cc) 20%,transparent)}
.ctile .cn{font-size:11.5px;font-weight:600;line-height:1.2;text-align:center;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;-webkit-hyphens:auto;hyphens:auto;min-height:2.4em;max-width:100%;letter-spacing:-.01em}
.ctile .cn.long{font-size:10px;letter-spacing:-.03em}
.ctile[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
.ctile[aria-pressed="true"] .ci{background:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 25%,transparent)}
.ctile.new{border:1.5px dashed var(--line);background:none}
.ctile.new .ci{background:var(--surface-2);color:var(--muted);font-weight:700;font-family:var(--f-display)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icn{height:40px;border:1.5px solid transparent;border-radius:12px;background:var(--surface-2);font-size:20px;line-height:1;padding:0}
.icn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* v9: alerts, fixed monitor, suggestion chips */
.alerts{display:grid;gap:6px}
.alert{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;color:var(--ink);font-size:13.5px;line-height:1.3}
.alert .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.alert.warn .ic{background:var(--warn-soft);color:var(--warn)}
.alert.bad .ic{background:var(--exp-soft);color:var(--exp)}
.alert.good .ic{background:var(--inc-soft);color:var(--inc)}
.alert.info .ic{background:var(--accent-soft);color:var(--accent)}
.al-t{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.al-t span{color:var(--muted)}
.al-more{justify-self:start;font-size:13px}
.fc-net{font-size:14px}
.fx-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fx-b .chip{min-height:32px;padding:4px 10px;font-size:12.5px}
.sugg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.sugg[hidden]{display:none}
.sugg .chip{min-height:36px;padding:4px 10px;font-size:13px}

.tx.fx .t1{display:block;text-align:left;white-space:normal}
.xhint{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}
.xhint[hidden]{display:none}
.xhint .chip{min-height:34px;font-size:13px}
.split-in{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.split-in .input{width:64px;text-align:center}
.brk-row.pot{width:100%;border:0;background:none;color:inherit;text-align:left;padding:0;font:inherit}
.pot-s{flex-wrap:wrap;margin-top:8px}

/* v6: cash-flow overview + day groups */
.flow{display:grid;gap:12px}
.flow-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.flow .big{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,9.5vw,44px);letter-spacing:-.03em;line-height:1.05}
.flow .lbl{color:var(--muted);font-size:14.5px;margin-top:2px}
.fl-ps{display:flex;gap:12px;padding-top:6px}
.fl-p{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15.5px;font-family:var(--f-num);letter-spacing:-.02em}
.fl-p i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--surface);font-style:normal;font-size:15px;font-weight:800;line-height:1;font-family:var(--f-body)}
.fl-p.inc{color:var(--inc)}.fl-p.inc i{background:var(--inc)}
.fl-p.exp{color:var(--exp)}.fl-p.exp i{background:var(--exp)}
.mnav{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:nowrap;min-width:0}
.mnav button{border:1.5px solid transparent;background:none;border-radius:999px;padding:8px 10px;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mnav button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);padding-inline:20px;flex:none}
.txlist{display:grid}
.txg{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 12px;box-shadow:var(--shadow)}
.card .txg{background:var(--surface-2);border:0;box-shadow:none}
.txg .tx{padding:11px 0;gap:14px}
.txg .av{width:44px;height:44px;border-radius:50%;font-size:21px}
.txg .t1{font-size:15.5px}
.txg .t2{font-size:13.5px}
.txg .amt{font-size:15.5px}
.tx-day{font-size:14px;font-weight:600;text-transform:none;padding:16px 8px 7px}
.tx-day span:first-child::first-letter{text-transform:uppercase}
.txlist>.more{margin-top:14px}
.datepick{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center}
.datepick .chip{padding:10px 14px;font-size:14px}

/* v7: notes collapsed behind a small "Cómo leerlo" */
details.how{display:block;background:none;padding:0;margin:8px 0 0}
details.how summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600}
details.how summary::-webkit-details-marker{display:none}
details.how p{margin:6px 0 0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;color:var(--muted)}

/* v8: compact, visual-first screens */
.bn-tab{display:none}
@media (max-width:640px),(pointer:coarse) and (max-width:932px){.bn-app{display:none}.bn-tab{display:inline}}
#periodBtn{flex:none;max-width:none}
#periodLbl{overflow:visible}
#app[data-view="resumen"] #periodBtn,#app[data-view="evolucion"] #periodBtn,#app[data-view="analisis"][data-sub="fijos"] #periodBtn,#app[data-view="analisis"][data-sub="viajes"] #periodBtn{display:none}
.icon-btn{width:40px;height:40px}
.chip{min-height:40px}
.seg button{min-height:40px}
.tab{min-height:40px}
@media (max-width:360px){.icon-btn{width:40px;height:40px}.bar{gap:6px}}
@media (max-width:340px){.bnav button{font-size:9.5px;letter-spacing:-.02em}}
/* day lists: denser rows */
.txg{padding:2px 12px}
.txg .tx{padding:7px 0;gap:12px;min-height:56px}
.txg .av{width:40px;height:40px;font-size:19px}
.txg .t1{font-size:15px}
.txg .t2{font-size:13px}
.txg .amt{font-size:15px}
.tx-day{padding:12px 8px 6px;font-size:13.5px}
.txlist>.tx-day:first-child{padding-top:4px}
/* Resumen: category strip + backup line */
.mix{display:grid;gap:8px}
.mix-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px}
.mix-bar b{display:block;height:100%;min-width:3px}
.mix-chips{display:flex;gap:6px;flex-wrap:wrap}
.mix-chips .chip{padding:4px 10px 4px 6px;font-size:13.5px}
.mix-chips .chip .ci{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1}
.mix-chips .chip.over{border-color:var(--exp);color:var(--exp)}
.mix-chips .chip .num{font-family:var(--f-num)}
.sync-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;padding:6px 12px;border-radius:12px;background:color-mix(in srgb,var(--exp) 12%,transparent);border:1px solid color-mix(in srgb,var(--exp) 30%,transparent)}
.sync-line b{color:var(--exp)}.sync-line .link{font-size:13px;min-height:40px;padding:0 6px;margin-left:auto}
.bk-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:2px 2px 0}
.bk-line .link{font-size:13px;min-height:40px;padding:0 6px}
.bk-line .x{border:0;background:none;color:var(--muted);width:40px;height:40px;margin-left:auto;font-size:18px;flex:none}
.bk-line span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bk-line .link{white-space:nowrap}
/* Movimientos */
.mv-top{display:flex;gap:8px;align-items:center}

.mv-top .icon-btn{width:44px;height:44px;border-radius:12px;position:relative}
.mv-top .icon-btn[aria-pressed="true"],.mv-top .icon-btn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icon-btn .cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.mv-sum{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:13.5px;color:var(--muted);padding:0 4px}
.mv-sum b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
.mv-sum .link{font-size:13.5px;min-height:32px;margin-left:auto}
.seg.full{display:flex}.seg.full button{flex:1}

.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:0 12px;min-height:40px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.subnav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card .insight{background:none;border-radius:0;padding:10px 0;border-top:1px solid var(--line);gap:10px;align-items:center}

.card .ins{gap:0}
.insight b.t{font-size:14px;font-weight:600}
.insight .ins-bar{margin-top:6px}
.card h3+.sub{margin-top:0}
.kpi .spark{height:24px}
.tx .t1.wrap{white-space:normal;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cnt-x{font-size:12px;font-weight:700;color:var(--muted);margin-left:6px}
.card .tx{padding:8px 0}
.card .tx .av{width:38px;height:38px;border-radius:50%}
/* sheets: denser */
.sheet{gap:12px}
.sheet h2{font-size:19px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;text-align:left;display:grid;gap:1px;min-height:52px}
.pgrid b{font-size:14.5px}
.pgrid small{font-size:12px;color:var(--muted)}
.pgrid button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.rows{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}

.rowi .rt{flex:1;min-width:0;display:grid}
.rowi .rt b{font-weight:600}
.rowi .rt small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi::after{content:"›";color:var(--muted);font-size:20px;line-height:1}
.rowi[aria-current="page"] b{color:var(--accent)}
.sline{font-size:13px;color:var(--muted);margin:0;display:flex;gap:8px;align-items:center}

.ctiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 2px}
@media (min-width:360px){.ctiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.ctile{background:none;padding:5px 0 4px;gap:3px;border-radius:12px;border-width:1.5px}
.ctile .ci{width:38px;height:38px;font-size:19px}
.ctile .cn,.ctile .cn.long{font-size:11px;letter-spacing:-.03em;min-height:0;display:block;white-space:nowrap;overflow:hidden;line-height:1.25;max-width:calc(100% + 8px);margin-inline:-4px;text-align:center}
.ctile[aria-pressed="true"]{background:color-mix(in srgb,var(--cc) 14%,var(--surface))}
.ctile.new{border-style:dashed}
.amount-in{font-size:32px}
details.opts summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center;gap:6px}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::after{content:"▾";font-size:12px}
details.opts[open] summary::after{content:"▴"}
details.opts>div{display:grid;gap:12px}
.switch{padding:8px 12px;align-items:center}
.datepick .chip{min-height:44px}
.bar{gap:8px}.brand{gap:8px}
section.view>*{min-width:0}
@media (max-width:380px){.subnav button{padding:0 8px;font-size:13.5px}.range-in{grid-template-columns:1fr}}
.stat3.tight{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat3.tight .mini{display:grid;gap:2px;align-content:start;padding:8px 10px}
.stat3.tight .mini>span:first-child{font-size:11.5px;line-height:1.25}
.stat3.tight .mini b{font-size:15px;white-space:normal}
@media (max-width:340px){.subnav button{padding:0 6px;font-size:13px}}
.stat3.tight .mini b~span{flex-basis:auto;font-size:11px}

/* r2 fixes */
.actions .err{flex:1 1 100%;margin:0 0 2px}
#f-cats.bad{outline:2px solid var(--exp);outline-offset:4px;border-radius:14px}
.amount-box.bad{border-color:var(--exp)}
#toast{background:#1B2130;color:#F4F6FB;border:1px solid rgba(255,255,255,.12);white-space:nowrap;max-width:calc(100% - 24px)}
#toast span{overflow:hidden;text-overflow:ellipsis}
#toast button{color:#8DB8FF;filter:none}
#toast[hidden]{display:none}

/* forecast card */
.fc{display:grid;gap:6px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);color:var(--ink)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fc-big{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1.05;color:var(--exp)}
.fc-rng{font-size:13px;color:var(--muted)}
.fc-bar{position:relative;display:flex;height:12px;border-radius:7px;background:var(--surface-2);margin:6px 0 2px}
.fc-bar b{height:100%;display:block}
.fc-bar b:first-child{border-radius:7px 0 0 7px}
.fc-bar b:last-of-type{border-radius:0 7px 7px 0}
.fc-bar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.fc-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.fc-leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.fc-leg b{color:var(--ink);font-weight:600}
</style>
</head>
<body>

<div id="app">
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i aria-hidden="true">€</i><span class="bname" id="bname"><span class="bn-app">Mis Gastos</span><span class="bn-tab" id="tabTitle">Resumen</span></span></div>
      <button class="pill-btn" id="periodBtn" aria-haspopup="dialog"><span id="periodLbl">12 meses</span> <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="themeBtn" aria-label="Tema"></button>
      <button class="icon-btn" id="dataBtn" aria-label="Datos: importar y exportar"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="resumen">Resumen</button>
      <button class="tab" role="tab" data-tab="movimientos">Movimientos</button>
      <button class="tab" role="tab" data-tab="analisis">Análisis</button>
      <button class="tab" role="tab" data-tab="evolucion">Evolución</button>
      <button class="tab" role="tab" data-tab="categorias">Categorías y presupuestos</button>
    </nav>
  </div>
</header>

<div id="scroller"><main class="wrap" id="main">
  <section class="view"><div class="card empty"><h2>Cargando tus movimientos…</h2><p>Tus gastos e ingresos aparecerán aquí en un momento.</p></div></section>
</main></div>

<nav class="bnav" id="bnav" aria-label="Secciones">
  <button data-bt="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Resumen</button>
  <button data-bt="movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</button>
  <button data-bt="add" class="bplus" aria-label="Añadir movimiento"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-bt="analisis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análisis</button>
  <button data-bt="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>Más</button>
</nav>
<button class="fab" id="fab"><span aria-hidden="true">+</span>Añadir</button>
</div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<div id="sheetRoot"></div>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json" hidden>

<script>
(() => {
"use strict";
/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let NF, NF0;
try { NF = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", useGrouping: "always" }); NF0 = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 0, useGrouping: "always" }); }
catch (e) { NF = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }); NF0 = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }); }
const minus = s => s.replace(/^-|(\s)-/g, "$1−");
const eur = v => minus(NF.format(Math.round((v || 0) * 100) / 100 || 0));

// signed amount: "+12 €", "−12 €", never "−0 €"
const sgn = (v, f = eur0) => { const r = f === eur0 ? Math.round(v) : Math.round(v * 100) / 100; return (r > 0 ? "+" : r < 0 ? "−" : "") + f(Math.abs(r)); };
// chip amounts: cents below 10 €
const eurS = v => Math.abs(v) < 10 ? eur(v) : eur0(v);
const pct = v => minus((isFinite(v) ? (v * 100).toFixed(Math.abs(v) < 0.1 ? 1 : 0).replace(".", ",") : "0") + " %");
const compact = v => { const a = Math.abs(v); return a >= 1000 ? (v / 1000).toFixed(a >= 10000 ? 0 : 1).replace(".", ",") + "k" : Math.round(v) + ""; };
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const MESL = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DOW = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"];
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseYM = k => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 1);
const addM = (k, n) => { const d = parseYM(k); d.setMonth(d.getMonth() + n); return ym(d); };

// the year shows only where it is needed: when the months span two years or are not this year
const needYear = ks => ks.some(k => k.slice(0, 4) !== String(new Date().getFullYear()));
const mLabels = ks => { const y = needYear(ks); return ks.map((k, i) => { const m = +k.slice(5, 7); return MES[m - 1] + (y && (m === 1 || i === 0) ? " " + k.slice(2, 4) : ""); }); };
const mFull = k => `${MESL[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}`;
const daysIn = k => new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate();
const monthsBetween = (a, b) => { const r = []; for (let k = a; k <= b; k = addM(k, 1)) r.push(k); return r; };
const uid = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (l, f = t => t.a) => l.reduce((s, t) => s + f(t), 0);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

const sleep = ms => new Promise(r => setTimeout(r, ms));
const dAt = s => new Date(s + "T12:00");
const fdShort = d => dAt(d).toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "2-digit" });
const PALETTE = ["#E4572E", "#2E86AB", "#F2A541", "#7B6CD9", "#3BB273", "#D7263D", "#1B998B", "#C17C74", "#5C80BC", "#E07BE0", "#8C9A2B", "#F46036", "#4D9DE0", "#B5838D", "#E1BC29", "#6D597A", "#2A9D8F", "#9C6644", "#577590", "#EF476F"];
const mono = name => { const w = String(name).split(/[\s/]+/).filter(Boolean); return ((w[0] || "?")[0] + (w[1] ? w[1][0] : (w[0] || "")[1] || "")).toUpperCase(); };
const ICON_RULES = [[/restaur|bebida|bar\b|cafe/, "🍽️"], [/super|comida|aliment/, "🛒"], [/factura|luz|agua|internet|telef/, "🧾"], [/transport|metro|bus|coche|gasolin/, "🚇"], [/fiesta|copas/, "🎉"], [/viaje|vacacion/, "✈️"], [/regalo/, "🎁"], [/gym|gimnas/, "🏋️"], [/boxeo/, "🥊"], [/deporte|hobb/, "🎾"], [/alquiler|hipoteca/, "🔑"], [/casa|hogar/, "🏠"], [/entreten|ocio|cine/, "🎬"], [/farmacia|salud|medic/, "💊"], [/pelu|belleza/, "💈"], [/ropa/, "👕"], [/compra/, "🛍️"], [/salario|nomina|sueldo/, "💼"], [/interes|dividend|inversion/, "📈"], [/mascota/, "🐾"], [/educa|curso|libro/, "📚"], [/suscrip/, "📺"], [/otro/, "📦"]];
const ICONS = ["🍽️", "☕", "🍺", "🛒", "🧾", "💡", "📱", "🚇", "🚗", "⛽", "✈️", "🏨", "🎉", "🎁", "🏋️", "🥊", "🎾", "⚽", "🔑", "🏠", "🛋️", "🎬", "🎮", "🎵", "📺", "💊", "🩺", "💈", "👕", "👟", "🛍️", "📚", "🐾", "👶", "💻", "🔧", "💼", "📈", "🏦", "💶", "💸", "❤️", "📦", "🏷️"];
const iconFor = c => { if (!c) return "🏷️"; if (c.icon) return c.icon; const n = String(c.name).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); const r = ICON_RULES.find(([re]) => re.test(n)); return r ? r[1] : "🏷️"; };
const avatar = c => `<span class="av" style="background:color-mix(in srgb,${c ? c.color : "#888"} 20%,transparent)" aria-hidden="true">${iconFor(c)}</span>`;
// tile label, short enough for a 5-column grid: first part of "A/B" names; a long one gives way to a very short
// other part ("Entretenimiento/ocio" -> "Ocio") or is abbreviated ("Restaurantes" -> "Restaur.")
const shortName = n => {
  const p = String(n).split("/").map(x => x.trim()).filter(Boolean); if (!p.length) return n;
  let w = p[0]; if (/^supermercado$/i.test(w)) w = "Súper";
  if (w.length > 10) { const alt = p.slice(1).reduce((a, b) => !a || b.length < a.length ? b : a, ""); w = alt && alt.length <= 5 ? alt : w.slice(0, 7) + "."; }
  return w.charAt(0).toUpperCase() + w.slice(1);
};
// category picker: big tiles with icon, most-used categories first
function catTiles(kind, sel, attr) {
  const since = addM(ym(new Date()), -6), n = {};
  S.txs.forEach(t => { if (t.k === kind && t.d >= since) n[t.c] = (n[t.c] || 0) + 1; });
  return S.cats.filter(c => c.kind === kind).sort((a, b) => (n[b.id] || 0) - (n[a.id] || 0) || a.name.localeCompare(b.name))
    .map(c => `<button type="button" class="ctile" ${attr}="${esc(c.id)}" aria-pressed="${c.id === sel}" title="${esc(c.name)}" aria-label="${esc(c.name)}" style="--cc:${c.color}"><span class="ci" aria-hidden="true">${iconFor(c)}</span><span class="cn${shortName(c.name).length > 10 ? " long" : ""}">${esc(shortName(c.name))}</span></button>`).join("");
}
const labelsOf = t => String(t.l || "").split(",").map(s => s.trim()).filter(Boolean);
const how = html => `<details class="how"><summary><i aria-hidden="true">i</i>Cómo leerlo</summary><p>${html}</p></details>`;

/* ---------- state ---------- */
const S = {
  txs: [], cats: [], fixOff: [], pot: null, goals: [], mode: "loading", loadedM: false, loadedC: false, lastBackup: null,
  tab: "resumen", period: lsGet("gastos.period") || "12m",
  q: "", catF: null, movM: null, anSub: lsGet("gastos.ansub") || "general", show: 60, movKind: "all", catKind: "e", lab: null, fmin: "", fmax: "", noNote: false, onlyX: false, showF: false, sel: null, cmp: null,
  custom: (() => { try { return JSON.parse(lsGet("gastos.custom") || "null"); } catch (e) { return null; } })()
};
let db = null, dl = null;
const catById = id => S.cats.find(c => c.id === id);
const HOLDER = uid();

/* ---------- storage ----------
   Movements live in one document per month. Every write takes a short lease on the month,
   re-reads it and applies only this change (by movement id), so edits made on two devices
   at the same time no longer overwrite each other. */
const LS = "misgastos.amigo.v1";
function loadLocal() {
  try { const o = JSON.parse(lsGet(LS) || "null"); if (o) { S.txs = o.txs || []; S.cats = o.cats || []; S.lastBackup = o.lastBackup || null; S.fixOff = o.fixOff || []; S.pot = o.pot || null; S.goals = o.goals || []; } } catch (e) {}
  sortTxs();
}
// a failed save must never look like a saved one: the app keeps working in memory and says so until it can save again
function saveLocal() {
  const ok = lsSet(LS, JSON.stringify({ txs: S.txs, cats: S.cats, lastBackup: S.lastBackup, fixOff: S.fixOff, pot: S.pot, goals: S.goals }));
  if (ok !== S.localOk) { S.localOk = ok; const m = document.getElementById("main"), old = m && m.querySelector(".sync-line"); if (old) old.remove(); if (!ok && m) { const v = m.querySelector(".view"); if (v) v.insertAdjacentHTML("afterbegin", syncLine()); } }
  if (!ok) throw Object.assign(new Error("local save failed"), { code: "local_failed" });
}
function syncLine() { return S.localOk === false ? `<div class="sync-line" role="status"><span><b>No se está guardando</b> · este navegador no deja guardar datos</span><button class="link" data-act="backup">Descargar copia</button></div>` : ""; }
function sortTxs() { S.txs.sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0)); }
const queues = {};
function queued(path, fn) { const p = (queues[path] || Promise.resolve()).then(fn); queues[path] = p.catch(() => {}); return p; }
async function writeMonth(k, delIds, ups) {
  const ref = db.doc("months/" + k);
  for (let i = 0; i < 16; i++) {
    let r; try { r = await ref.acquire({ holder: HOLDER, ttlMs: 5000 }); } catch (e) { break; }
    if (r && r.acquired) break;
    await sleep(200 + Math.random() * 300);
  }
  const snap = await ref.get();
  const upIds = new Set(ups.map(t => t.id));
  const list = (snap.exists ? ((snap.data() || {}).txs || []) : []).filter(t => !delIds.has(t.id) && !upIds.has(t.id)).map(t => ({ ...t })).concat(ups);
  await (list.length ? ref.set({ txs: list }) : ref.delete());
}
async function commit(up = [], del = []) {
  if (S.mode !== "cloud") { saveLocal(); return; }
  const by = {}, M = k => (by[k] ||= { del: new Set(), up: [] });
  del.forEach(t => M(t.d.slice(0, 7)).del.add(t.id));
  up.forEach(t => M(t.d.slice(0, 7)).up.push(t));
  for (const [k, v] of Object.entries(by)) await queued("months/" + k, () => writeMonth(k, v.del, v.up));
}
async function persistConfig() {
  if (S.mode !== "cloud") { saveLocal(); return; }
  const data = { cats: S.cats, currency: "EUR", v: 1 }; if (S.lastBackup) data.lastBackup = S.lastBackup; if (S.fixOff && S.fixOff.length) data.fixOff = S.fixOff; if (S.pot > 0) data.pot = S.pot; if (S.goals && S.goals.length) data.goals = S.goals;
  await queued("meta/config", () => db.doc("meta/config").set(data));
}
function failed(e) {
  console.error(e);
  const code = e && e.code;
  if (code === "local_failed") return toast("No se pudo guardar en este navegador. Descarga una copia para no perder datos.");
  toast(code === "quota_exceeded" ? "No hay espacio para guardar más datos." : code === "invalid_argument" ? "No tienes permiso para guardar cambios aquí." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.");
}
function replaceTxs(news) { const ids = new Set(news.map(t => t.id)); S.txs = news.concat(S.txs.filter(t => !ids.has(t.id))); sortTxs(); }

/* ---------- periods ---------- */
const PERIODS = [["mes", "Este mes"], ["mesant", "Mes pasado"], ["3m", "3 meses"], ["6m", "6 meses"], ["12m", "12 meses"], ["anio", "Este año"], ["todo", "Todo"]];
function range(p = S.period) {
  const r = rangeRaw(p);
  if (r.prev && S.txs.length && r.prev.s < S.txs[S.txs.length - 1].d.slice(0, 10)) r.prev = null;
  return r;
}
function rangeRaw(p) {
  const now = new Date(), cur = ym(now);
  const end = k => k + "-" + pad(daysIn(k));
  const mr = (a, b, n) => ({ s: a + "-01", e: end(b), months: monthsBetween(a, b), prev: n ? { s: addM(a, -n) + "-01", e: end(addM(b, -n)) } : null });
  switch (p) {
    case "mes": return mr(cur, cur, 1);
    case "mesant": return mr(addM(cur, -1), addM(cur, -1), 1);
    case "3m": return mr(addM(cur, -2), cur, 3);
    case "6m": return mr(addM(cur, -5), cur, 6);
    case "anio": { const y = now.getFullYear(); const r = mr(y + "-01", cur, 0); r.prev = { s: (y - 1) + "-01-01", e: (y - 1) + ymd(now).slice(4) }; return r; }
    case "custom": {
      const c = S.custom; if (!c || !c.s || !c.e) return rangeRaw("12m");
      const a = c.s <= c.e ? c.s : c.e, b = c.s <= c.e ? c.e : c.s;
      return { s: a, e: b, months: monthsBetween(a.slice(0, 7), b.slice(0, 7)), nm: Math.max(1, daysBetween(a, b) / 30.44), prev: shiftBack(a, b) };
    }
    case "todo": { const f = S.txs.length ? S.txs[S.txs.length - 1].d.slice(0, 7) : cur; return mr(f, cur, 0); }
    default: return mr(addM(cur, -11), cur, 12);
  }
}
const daysBetween = (a, b) => Math.round((dAt(b) - dAt(a)) / 864e5) + 1;
function shiftBack(a, b) { const days = daysBetween(a, b); const pe = dAt(a); pe.setDate(pe.getDate() - 1); const ps = new Date(pe); ps.setDate(ps.getDate() - days + 1); return { s: ymd(ps), e: ymd(pe) }; }
const yearBack = d => (+d.slice(0, 4) - 1) + d.slice(4);
const inR = (t, r) => { const d = t.d.slice(0, 10); return d >= r.s && d <= r.e; };
function customName() {

const parseNum = s => { s = String(s || "").trim().replace(/[€\s]/g, ""); if (/,\d{1,2}$/.test(s) || (/,/.test(s) && !/\./.test(s))) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, ""); return parseFloat(s); };

async function importText(name, text) {
  let incoming = [], cats = [];
  if (/\.json$/i.test(name) || /^\s*\{/.test(text)) {
    const o = JSON.parse(text); if (!o || !Array.isArray(o.txs)) throw new Error("Este JSON no es una copia de Mis Gastos.");
    cats = Array.isArray(o.cats) ? o.cats : [];
    const cn = id => (cats.find(c => c.id === id) || {}).name || "Otros";
    incoming = o.txs.filter(t => t && t.d && t.a > 0).map(t => ({ d: String(t.d).slice(0, 16), k: t.k === "i" ? "i" : "e", a: +t.a, cn: cn(t.c), n: t.n || "", l: t.l || "", x: !!t.x, color: (cats.find(c => c.id === t.c) || {}).color, budget: (cats.find(c => c.id === t.c) || {}).budget }));
  } else incoming = rowsFromCSV(text);
  // same day, type, amount and note = the same movement (CSVs often carry no time); counted, so two identical
  // coffees on one day still import as two when only one is already here
  const key = t => [t.d.slice(0, 10), t.k, t.a.toFixed(2), (t.n || "").trim().toLowerCase()].join("|");
  const have = new Map(); S.txs.forEach(t => have.set(key(t), (have.get(key(t)) || 0) + 1)); let dup = 0, newCats = 0; const added = [];
  for (const r of incoming) {
    const hk = key(r); if (have.get(hk) > 0) { have.set(hk, have.get(hk) - 1); dup++; continue; }
    let c = S.cats.find(x => x.kind === r.k && x.name.trim().toLowerCase() === r.cn.trim().toLowerCase());
    if (!c) { c = newCat(r.cn.trim(), r.k); if (r.color) c.color = r.color; if (r.budget) c.budget = r.budget; newCats++; }
    const t = { id: uid() + added.length, d: r.d, k: r.k, c: c.id, a: r.a, n: r.n }; if (r.l) t.l = r.l; if (r.x && r.k === "e") t.x = true;

function toCSV() {
  const q = s => /[",\n;]/.test(s) ? '"' + String(s).replace(/"/g, '""') + '"' : s;
  const lines = ['Date,Wallet,Type,"Category name",Amount,Currency,Note,Labels,Author,Extraordinario'];
  for (const t of [...S.txs].reverse()) lines.push([t.d.slice(0, 16).replace("T", " "), "Mis Gastos", t.k === "i" ? "Income" : "Expense", q(catById(t.c)?.name || "Otros"), (t.k === "i" ? "" : "-") + t.a.toFixed(2), "EUR", q(t.n || ""), q(t.l || ""), "", t.x ? "sí" : ""].join(","));

async function saveFile(filename, data) {

    try { await dl.save({ filename, data }); return true; }
    catch (e) { if (e && (e.code === "declined" || e.code === "cancelled")) return false; }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Archivo descargado: " + filename); return true;
  } catch (e) {}
  return new Promise(res => openSheet(`<h2>Copia el contenido</h2><p class="muted" style="margin:0;font-size:13.5px">Esta vista no permite descargar archivos. Copia el texto y guárdalo como <b>${esc(filename)}</b>.</p><textarea class="dump" id="dump" readonly>${esc(data)}</textarea><div class="actions"><button class="btn primary" id="cp">Copiar</button><button class="btn ghost" id="cl">Cerrar</button></div>`, sh => {
    $("#cl", sh).onclick = () => { closeSheet(); res(false); };
    $("#cp", sh).onclick = () => { const ta = $("#dump", sh); const done = () => { toast("Copiado"); res(true); }; if (navigator.clipboard) navigator.clipboard.writeText(data).then(done, () => { ta.select(); res(true); }); else { ta.select(); res(true); } };
  }));
}
